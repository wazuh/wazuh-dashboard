name: Build Wazuh Dashboard Plugins

on:
  workflow_call:
    inputs:
      reference_plugins:
        type: string
        description: 'Git ref (branch/tag) to use for all plugins'
        required: false
      version_opensearch:
        type: string
        description: 'OpenSearch version'
        required: true
      name:
        description: 'Name of the plugin'
        required: true
        type: string
      packageName:
        description: 'Name of the package'
        required: true
        type: string
      repo:
        type: string
        description: 'Repository of the plugin ( owner/repo )'
        required: true
      path:
        description: 'Path to the plugin ( only for wazuh-dashboard-plugins repo )'
        required: false
        type: string
      pathPlugin:
        type: string
        description: 'Path to the plugins folder ( only for wazuh-dashboard-plugins repo )'
        required: false
      execution_repository:
        description: 'Repository and workflow run to upload the artifact to (format: repo/workflow). This is used to locate the artifacts in S3.'
        required: true
        default: ''
        type: string

env:
  CI_DEV_INTERNAL_BUCKET: ${{ secrets.CI_DEV_INTERNAL_BUCKET }}
  # Repository and workflow run to upload the artifact to (format: repo/workflow). This is used to locate the artifacts in S3.
  EXECUTION_REPOSITORY: ${{ inputs.execution_repository || 'wazuh-dashboard/4_builderpackage_dashboard_plugins' }}

jobs:
  build-plugins:
    name: Build Plugin ${{ inputs.name }}
    permissions:
      id-token: write
    runs-on: codebuild-github-actions-codebuild-runner-dashboard-amd-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      PLUGIN_REF: ${{ inputs.reference_plugins }}
    steps:
      - name: Checkout Wazuh Dashboards
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn
        run: |
          npm install -g yarn@1.22.10
          yarn config set network-timeout 1000000 -g

      - name: Configure Yarn Cache
        run: echo "YARN_CACHE_LOCATION=$(yarn cache dir)" >> $GITHUB_ENV

      - name: Initialize Yarn Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_LOCATION }}
          key: yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-

      - name: Check if plugin reference exists or use github.ref_name
        run: |
          if [ -z "${{ inputs.reference_plugins }}" ]; then
            echo "No plugin reference provided, using github.ref_name: ${{ github.ref_name }}"
            echo "PLUGIN_REF=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            if [ "$(git ls-remote https://github.com/${{ inputs.repo }}.git ${{ inputs.reference_plugins }})" ]; then
              echo "Plugin reference ${{ inputs.reference_plugins }} exists."
              PLUGIN_REF=${{ inputs.reference_plugins }}
            else
              echo "Plugin reference ${{ inputs.reference_plugins }} does not exist, trying with github.ref_name: ${{ github.ref_name }}"
              if [ "$(git ls-remote https://github.com/${{ inputs.repo }}.git ${{ github.ref_name }})" ]; then
                echo "Plugin reference ${{ github.ref_name }} exists."
                PLUGIN_REF=${{ github.ref_name }}
              else
                echo "Plugin reference ${{ github.ref_name }} does not exist. Please check if the reference is correct."
                exit 1
              fi
            fi

            echo "PLUGIN_REF=$PLUGIN_REF" >> $GITHUB_ENV
          fi

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ env.PLUGIN_REF }}
          path: ${{ inputs.pathPlugin || format('plugins/{0}', inputs.name) }}

      - name: Get commit SHA of the plugin of wazuh-dashboard-plugins
        run: |
          echo 'Getting commit sha'
          if [  ${{ inputs.repo }} == 'wazuh/wazuh-dashboard-plugins' ]; then
            COMMIT_SHA=$(cd ${{inputs.pathPlugin}}/${{ inputs.path }} && git rev-parse --short HEAD)
          else
            COMMIT_SHA=$(cd plugins/${{ inputs.name }} && git rev-parse --short HEAD)
          fi
          echo "COMMIT_SHA=$COMMIT_SHA"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Move plugin to correct path and remove wazuh-dashboard-plugins parent folder
        if: ${{ inputs.repo == 'wazuh/wazuh-dashboard-plugins' }}
        run: |
          mv ${{inputs.pathPlugin}}/${{ inputs.path }} plugins/${{ inputs.name }}
          rm -rf ${{inputs.pathPlugin}}

      # Workaround: AWS CodeBuild runners execute as root; OpenSearch Dashboards refuses to run as root
      - name: Create non-root build user
        run: |
          useradd -m builduser
          chown -R builduser:builduser .

      - name: Bootstrap with Plugins
        env:
          GIT_REF: ${{ env.PLUGIN_REF }}
        run: |
          chown -R builduser:builduser "$YARN_CACHE_LOCATION" 2>/dev/null || true
          sudo -u builduser -H env PATH="$PATH" GIT_REF="$GIT_REF" yarn osd bootstrap --single-version=loose || \
          sudo -u builduser -H env PATH="$PATH" GIT_REF="$GIT_REF" yarn osd bootstrap --single-version=loose

      - name: Build Plugin
        working-directory: plugins/${{ inputs.name }}
        env:
          GIT_REF: ${{ env.PLUGIN_REF }}
        run: |
          set -o pipefail
          sudo -u builduser -H env PATH="$PATH" GIT_REF="$GIT_REF" OPENSEARCH_DASHBOARDS_VERSION="${{ inputs.version_opensearch }}" yarn build 2>&1 | tee build.log

      - name: Build metadata
        if: success()
        working-directory: plugins/${{ inputs.name }}
        run: |
          jq -n --arg commit_sha "${{ env.COMMIT_SHA }}" '{ commit_sha: $commit_sha }' > build/metadata.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifact to S3
        if: success()
        run: |
          echo "Uploading plugin artifact to S3"
          aws s3 cp plugins/${{ inputs.name }}/build s3://${{ env.CI_DEV_INTERNAL_BUCKET }}/${{ env.EXECUTION_REPOSITORY }}/${{ github.run_id }}/${{ inputs.name }} --recursive

      - name: Upload Build Log
        if: failure()
        run: |
          echo "Uploading build log to S3"
          aws s3 cp plugins/${{ inputs.name }}/build.log s3://${{ env.CI_DEV_INTERNAL_BUCKET }}/${{ env.EXECUTION_REPOSITORY }}/${{ github.run_id }}/${{ inputs.name }}/build.log
