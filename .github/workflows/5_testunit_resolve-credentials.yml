# This workflow runs the unit tests of the package credential resolver
# (dev-tools/build-packages/credentials) on pull requests that modify it.
#
# Draft pull requests are skipped; the workflow runs once the PR is ready
# for review.
#
# The resolver runs on the bundled Node outside the dashboard build, so the
# tests are a node:test file. Only its two dependencies are installed, at the
# versions yarn.lock resolves, instead of bootstrapping the whole repository.

name: Run credential resolver unit tests
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'dev-tools/build-packages/credentials/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Run credential resolver unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install the resolver dependencies
        run: npm install --prefix "${RUNNER_TEMP}/deps" --no-save --no-package-lock node-forge@1.4.0 js-yaml@4.1.1

      - name: Run credential resolver unit tests
        run: NODE_PATH="${RUNNER_TEMP}/deps/node_modules" node --test dev-tools/build-packages/credentials/resolve-credentials.test.js
