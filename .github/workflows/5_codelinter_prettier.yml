name: (5.x) Prettier

on:
  pull_request:
    branches:
      - main
      - 5.*
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  prettier:
    name: Ensure the code format on the changed files
    runs-on: codebuild-github-actions-codebuild-runner-dashboard-amd-${{ github.run_id }}-${{ github.run_attempt }}
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The check compares against the point the branch left its base, which
          # needs the history both share. A shallow checkout does not have it.
          fetch-depth: 0

      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Verify the changed files
        run: |
          REMOTE_NAME=origin
          echo "Base ref: $GITHUB_BASE_REF"
          echo "Head ref: $GITHUB_HEAD_REF"
          echo "Fetching branch: $GITHUB_BASE_REF"
          git fetch origin $GITHUB_BASE_REF
          echo "Fetching branch: $GITHUB_HEAD_REF"
          git fetch origin $GITHUB_HEAD_REF
          echo "Listing branches"
          git branch -a
          echo "Getting diff files ignoring deleted and getting the changed or renamed files"
          CHANGED_FILES=$(git diff --name-status --diff-filter d ${REMOTE_NAME}/${GITHUB_BASE_REF}..${REMOTE_NAME}/${GITHUB_HEAD_REF} | awk '{print $NF}')
          echo "Changed files:"
          echo "${CHANGED_FILES}"
          git checkout $GITHUB_HEAD_REF
          echo "Installing dependencies"
          yarn install --ignore-scripts
          echo "Running prettier on the changed files"
          # A scheduled upward merge carries lines written on the branch being
          # merged. Those were written there, not here, so that branch counts as
          # a second base and the merge is checked only on lines that exist in
          # neither parent.
          BASES="--base ${REMOTE_NAME}/${GITHUB_BASE_REF}"
          case "${GITHUB_HEAD_REF}" in
            merge-*-into-*)
              SOURCE_BRANCH=${GITHUB_HEAD_REF#merge-}
              SOURCE_BRANCH=${SOURCE_BRANCH%-into-*}
              echo "Merge branch detected, adding ${SOURCE_BRANCH} as a base"
              if git fetch origin "${SOURCE_BRANCH}"; then
                BASES="${BASES} --base ${REMOTE_NAME}/${SOURCE_BRANCH}"
              else
                echo "Could not fetch ${SOURCE_BRANCH}, falling back to the base branch alone"
              fi
              ;;
          esac

          echo "Checking the lines this change writes"
          node dev-tools/prettier-check-changed.js ${BASES} ${CHANGED_FILES}
