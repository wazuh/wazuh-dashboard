# This workflow automates the build and push of Wazuh dashboard development
# Docker images for different architectures (amd64 and arm64).
#
# This workflow:
# - Builds multi-architecture Docker images for Wazuh dashboard development.
# - Pushes individual architecture images to Quay.io registry.
# - Creates and pushes a multi-arch manifest combining both architectures.
# - Automatically extracts versions from package.json and .nvmrc
# - Runs once a week, and supports manual triggering with customizable inputs
#   for Node.js version, OpenSearch Dashboards plugins version, branch and
#   image tag.
# - Accepts an optional branch for the Wazuh plugin repositories. It is resolved
#   per repository: when the branch does not exist in a repository, that
#   repository falls back to the branch the workflow runs on, and to main when
#   that one does not exist there either.

name: (5.x) Build and Push Image

on:
  schedule:
    - cron: '0 0 * * 1' # Runs at 00:00 every Monday
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to use for all Wazuh dashboard components (defaults to the branch this workflow runs on)'
        required: false
        default: ''
        type: string
      plugins_branch:
        description: 'Branch of the Wazuh plugin repositories. Falls back per repository to the branch above, and then to main, when it does not exist there'
        required: false
        default: ''
        type: string
      tag:
        description: 'Tag for the Docker image (defaults to the version in package.json)'
        required: false
        default: ''
        type: string
      node_version:
        description: 'Node.js version (defaults to the version in .nvmrc)'
        required: false
        default: ''
        type: string
      opensearch_version:
        description: 'Version of OpenSearch Dashboards plugins to install (defaults to the version in package.json)'
        required: false
        default: ''
        type: string

jobs:
  extract-versions:
    runs-on: codebuild-github-actions-codebuild-runner-dashboard-amd-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      opensearch_version: ${{ steps.versions.outputs.opensearch_version }}
      tag: ${{ steps.versions.outputs.tag }}
      node_version: ${{ steps.versions.outputs.node_version }}
      branch: ${{ steps.versions.outputs.branch }}
      security_branch: ${{ steps.plugin_branches.outputs.security_branch }}
      reporting_branch: ${{ steps.plugin_branches.outputs.reporting_branch }}
      plugins_branch: ${{ steps.plugin_branches.outputs.plugins_branch }}
      security_analytics_branch: ${{ steps.plugin_branches.outputs.security_analytics_branch }}
      alerting_branch: ${{ steps.plugin_branches.outputs.alerting_branch }}
      notifications_branch: ${{ steps.plugin_branches.outputs.notifications_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - name: Extract versions from repository
        id: versions
        run: |
          # Extract from package.json
          OPENSEARCH_VERSION=$(node -p "require('./package.json').version")

          # Extract from .nvmrc
          NODE_VERSION=$(cat .nvmrc)

          # Get current branch
          BRANCH="${{ inputs.branch || github.ref_name }}"

          # Determine tag
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$OPENSEARCH_VERSION"
          fi

          FINAL_OPENSEARCH_VERSION="${{ inputs.opensearch_version }}"
          if [ -z "$FINAL_OPENSEARCH_VERSION" ]; then
            FINAL_OPENSEARCH_VERSION="${OPENSEARCH_VERSION}.0"
          fi

          FINAL_NODE_VERSION="${{ inputs.node_version }}"
          if [ -z "$FINAL_NODE_VERSION" ]; then
            FINAL_NODE_VERSION="$NODE_VERSION"
          fi

          echo "opensearch_version=${FINAL_OPENSEARCH_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "node_version=${FINAL_NODE_VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

          echo "📦 OpenSearch Version: ${FINAL_OPENSEARCH_VERSION}"
          echo "🏷️  Tag: ${TAG}"
          echo "📟 Node Version: ${FINAL_NODE_VERSION}"
          echo "🌿 Branch: ${BRANCH}"

      - name: Resolve plugin repository branches
        id: plugin_branches
        env:
          BRANCH: ${{ steps.versions.outputs.branch }}
          PLUGINS_BRANCH: ${{ inputs.plugins_branch }}
        run: |
          # Resolve the branch of every plugin repository. Each candidate is used
          # only in the repositories where it exists: the requested plugins
          # branch first, then the branch the workflow runs on, then main.
          resolve_branch() {
            repo="$1"
            output="$2"
            url="https://github.com/wazuh/${repo}.git"

            # Candidates, in order of preference and without repetitions
            candidates=""
            for candidate in "$PLUGINS_BRANCH" "$BRANCH" main; do
              [ -n "$candidate" ] || continue
              case " ${candidates} " in *" ${candidate} "*) continue ;; esac
              candidates="${candidates} ${candidate}"
            done

            resolved=""
            for candidate in $candidates; do
              if git ls-remote --heads --tags "$url" "$candidate" | grep -q .; then
                resolved="$candidate"
                break
              fi
              echo "⚠️  ${repo}: branch '${candidate}' not found"
            done

            if [ -z "$resolved" ]; then
              echo "❌ ${repo}: none of the candidate branches exist (${candidates})"
              exit 1
            fi

            echo "🌿 ${repo}: ${resolved}"
            echo "${output}=${resolved}" >> "$GITHUB_OUTPUT"
          }

          resolve_branch wazuh-security-dashboards-plugin security_branch
          resolve_branch wazuh-dashboard-reporting reporting_branch
          resolve_branch wazuh-dashboard-plugins plugins_branch
          resolve_branch wazuh-dashboard-security-analytics security_analytics_branch
          resolve_branch wazuh-dashboard-alerting alerting_branch
          resolve_branch wazuh-dashboard-notifications notifications_branch

  build:
    runs-on: ${{ matrix.runner }}
    needs: [extract-versions]
    # Just under the 120 minute limit of the CodeBuild runners, so that a build
    # that does not finish is cut by GitHub and still uploads its log
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ format('codebuild-github-actions-codebuild-runner-dashboard-amd-{0}-{1}', github.run_id, github.run_attempt) }}
            arch: amd64
          - platform: linux/arm64
            runner: ${{ format('codebuild-github-actions-codebuild-runner-dashboard-arm-{0}-{1}', github.run_id, github.run_attempt) }}
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.extract-versions.outputs.branch }}

      # Workaround: AWS CodeBuild runners do not start the Docker daemon
      # automatically, and on the arm ones / is an overlay mount, where the
      # overlay driver cannot stack. vfs works everywhere but copies the whole
      # tree on every layer, which turns a 1 KB COPY into ~19 minutes here, so
      # it is the last resort.
      - name: Start Docker daemon
        run: |
          start_dockerd() {
            sudo rm -f /var/run/docker.pid
            sudo nohup dockerd $1 > /var/log/dockerd.log 2>&1 &
            timeout 60 bash -c 'until docker info &>/dev/null 2>&1; do sleep 1; done'
          }

          overlay_stacks() {
            work=$(sudo mktemp -d)
            sudo mkdir -p "$work/lower" "$work/upper" "$work/work" "$work/merged"
            opts="lowerdir=$work/lower,upperdir=$work/upper,workdir=$work/work"
            if sudo mount -t overlay overlay -o "$opts" "$work/merged" 2>/dev/null; then
              sudo umount "$work/merged"
              sudo rm -rf "$work"
              return 0
            fi
            sudo rm -rf "$work"
            return 1
          }

          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already running"
          elif overlay_stacks; then
            echo "overlay mounts stack here, letting dockerd pick its driver"
            start_dockerd ""
          elif sudo apt-get install -y -qq fuse-overlayfs >/dev/null 2>&1; then
            echo "overlay mounts do not stack here, using fuse-overlayfs"
            start_dockerd "--storage-driver fuse-overlayfs" || start_dockerd "--storage-driver vfs"
          else
            echo "overlay mounts do not stack here and fuse-overlayfs is unavailable, using vfs"
            start_dockerd "--storage-driver vfs"
          fi

          docker info --format 'Storage driver in use: {{.Driver}}'

      # Workaround: AWS CodeBuild runners hit Docker Hub anonymous pull rate limits
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build ${{ matrix.arch }} image
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          # The runner log is not archived when the job is cancelled, so keep a
          # copy of the build output as an artifact
          set -o pipefail
          exec > >(tee /tmp/build-${{ matrix.arch }}.log) 2>&1

          chmod +x ./dev-tools/build-dev-image/build-multiarch.sh
          cd ./dev-tools/build-dev-image

          ./build-multiarch.sh \
            --node-version "${{  needs.extract-versions.outputs.node_version }}" \
            --opensearch-version "${{ needs.extract-versions.outputs.opensearch_version }}" \
            --wazuh-branch "${{ needs.extract-versions.outputs.branch }}" \
            --security-branch "${{ needs.extract-versions.outputs.security_branch }}" \
            --reporting-branch "${{ needs.extract-versions.outputs.reporting_branch }}" \
            --plugins-branch "${{ needs.extract-versions.outputs.plugins_branch }}" \
            --security-analytics-branch "${{ needs.extract-versions.outputs.security_analytics_branch }}" \
            --alerting-branch "${{ needs.extract-versions.outputs.alerting_branch }}" \
            --notifications-branch "${{ needs.extract-versions.outputs.notifications_branch }}" \
            --tag "${{ needs.extract-versions.outputs.tag }}-${{ matrix.arch }}" \
            --platform "${{ matrix.platform }}" \
            --push

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: /tmp/build-${{ matrix.arch }}.log
          if-no-files-found: warn

      - name: Report runner resources
        if: always()
        run: |
          echo "=== Memory ==="
          free -h || true
          echo "=== Disk ==="
          df -h || true
          echo "=== Kernel OOM kills ==="
          sudo dmesg 2>/dev/null | grep -iE 'killed process|out of memory' | tail -20 || echo "dmesg not available"

  create-manifest:
    runs-on: ${{ format('codebuild-github-actions-codebuild-runner-dashboard-amd-{0}-{1}', github.run_id, github.run_attempt) }}
    needs: [extract-versions, build]

    steps:
      # Workaround: AWS CodeBuild runners do not start the Docker daemon
      # automatically, and on the arm ones / is an overlay mount, where the
      # overlay driver cannot stack. vfs works everywhere but copies the whole
      # tree on every layer, which turns a 1 KB COPY into ~19 minutes here, so
      # it is the last resort.
      - name: Start Docker daemon
        run: |
          start_dockerd() {
            sudo rm -f /var/run/docker.pid
            sudo nohup dockerd $1 > /var/log/dockerd.log 2>&1 &
            timeout 60 bash -c 'until docker info &>/dev/null 2>&1; do sleep 1; done'
          }

          overlay_stacks() {
            work=$(sudo mktemp -d)
            sudo mkdir -p "$work/lower" "$work/upper" "$work/work" "$work/merged"
            opts="lowerdir=$work/lower,upperdir=$work/upper,workdir=$work/work"
            if sudo mount -t overlay overlay -o "$opts" "$work/merged" 2>/dev/null; then
              sudo umount "$work/merged"
              sudo rm -rf "$work"
              return 0
            fi
            sudo rm -rf "$work"
            return 1
          }

          if docker info >/dev/null 2>&1; then
            echo "Docker daemon already running"
          elif overlay_stacks; then
            echo "overlay mounts stack here, letting dockerd pick its driver"
            start_dockerd ""
          elif sudo apt-get install -y -qq fuse-overlayfs >/dev/null 2>&1; then
            echo "overlay mounts do not stack here, using fuse-overlayfs"
            start_dockerd "--storage-driver fuse-overlayfs" || start_dockerd "--storage-driver vfs"
          else
            echo "overlay mounts do not stack here and fuse-overlayfs is unavailable, using vfs"
            start_dockerd "--storage-driver vfs"
          fi

          docker info --format 'Storage driver in use: {{.Driver}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          TAG="${{ needs.extract-versions.outputs.tag }}"

          docker buildx imagetools create -t quay.io/wazuh/osd-dev:${TAG} \
            quay.io/wazuh/osd-dev:${TAG}-amd64 \
            quay.io/wazuh/osd-dev:${TAG}-arm64

          echo "✅ Multi-arch manifest created and pushed!"
          echo "📦 Image available at: quay.io/wazuh/osd-dev:${TAG}"
